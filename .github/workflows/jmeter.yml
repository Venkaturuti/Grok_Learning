name: JMeter test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      max_avg_ms:
        description: 'Max average response time (ms)'
        default: '500'
      max_error_pct:
        description: 'Max error rate (%)'
        default: '1'
      users:
        description: 'Number of users'
        default: '2'
      rampup:
        description: 'Ramp-up time (seconds)'
        default: '1'

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JMeter and plugins
        run: |
          wget -q https://dlcdn.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          cd apache-jmeter-5.6.3
          wget -q -O lib/ext/jmeter-plugins-manager.jar https://jmeter-plugins.org/get/
          wget -q -O lib/cmdrunner-2.3.jar https://repo1.maven.org/maven2/kg/apc/cmdrunner/2.3/cmdrunner-2.3.jar
          java -cp lib/ext/jmeter-plugins-manager.jar org.jmeterplugins.repository.PluginManagerCMDInstaller
          ./bin/PluginsManagerCMD.sh install jpgc-dummy

      - name: Run test
            
        env:
          APP_URL: ${{ secrets.APP_URL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          ./apache-jmeter-5.6.3/bin/jmeter -n -t JMeter_Learning.jmx -l results/results.jtl -e -o report -Jusers=${{ inputs.users || '2' }} -Jrampup=${{ inputs.rampup || '1' }} -Jhost="$APP_URL" -Jpassword="$APP_PASSWORD"
          
          

      - name: Check thresholds
        run: |
          MAX_AVG_MS=${{ inputs.max_avg_ms || '500' }}
          MAX_ERROR_PCT=${{ inputs.max_error_pct || '1' }}
          awk -F',' -v maxavg=$MAX_AVG_MS -v maxerr=$MAX_ERROR_PCT '
            NR>1 { n++; total+=$2; if ($8!="true") err++ }
            END {
              avg=total/n; errpct=err*100/n
              printf "Samples: %d  Avg: %.0f ms  Errors: %.2f%%\n", n, avg, errpct
              if (avg>maxavg)   { print "FAIL: average " avg " ms is above " maxavg " ms"; exit 1 }
              if (errpct>maxerr){ print "FAIL: error rate " errpct "% is above " maxerr "%"; exit 1 }
              print "PASS: within thresholds"
            }' results/results.jtl

      - name: Results summary
        if: always()
        run: |
          F=results/results.jtl
          N=$(tail -n +2 $F | wc -l)
          AVG=$(awk -F',' 'NR>1{t+=$2}END{printf "%.0f", t/(NR-1)}' $F)
          MAX=$(awk -F',' 'NR>1{if($2>m)m=$2}END{print m}' $F)
          P90=$(tail -n +2 $F | cut -d',' -f2 | sort -n | awk '{a[NR]=$1}END{i=int(NR*0.9); if(i<1)i=1; print a[i]}')
          ERR=$(awk -F',' 'NR>1 && $8!="true"{e++}END{printf "%.2f", e*100/(NR-1)}' $F)
          echo "## JMeter results" >> $GITHUB_STEP_SUMMARY
          echo "| Samples | Avg (ms) | 90th pct (ms) | Max (ms) | Errors |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| $N | $AVG | $P90 | $MAX | $ERR% |" >> $GITHUB_STEP_SUMMARY
          echo "Users: ${{ inputs.users || '2' }}, Ramp-up: ${{ inputs.rampup || '1' }}s, Limit: ${{ inputs.max_avg_ms || '500' }} ms" >> $GITHUB_STEP_SUMMARY
          
      - name: Save HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report
          path: report
